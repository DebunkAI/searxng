# Force Docker (image officielle SearXNG), pas Railpack/Go.
# Si Railway détecte « Detected Golang », le service pointe vers le mauvais repo (ex. upstream sans Dockerfile).
# Repo DebunkAI/searxng : Root Directory = / (racine), branche master, builder DOCKERFILE.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
